<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daxil ol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet"/>
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="min-h-screen bg-[#081028] flex items-center justify-center">

  <div class="w-[380px] bg-[#0b1739] border border-white/[0.07] rounded-2xl px-9 py-10">

    <!-- Logo -->
    <div class="flex items-center gap-3 mb-8">
      <svg width="30" height="30" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
        <path fill="#017bfe" d="M70.5 84.5c-.2373-1.291.096-2.291 1-3 21.8405.3271 32.341-10.3395 31.5-32-2.5-10.5-9-17-19.5-19.5-24.6667-.3333-49.3333-.6667-74-1-.77972-1.073-.61305-2.2396.5-3.5C16.1349 18.364 22.6349 11.5307 29.5 5l6-3c19-.66667 38-.66667 57 0 32.848 7.87547 47.348 28.7088 43.5 62.5-1.027 4.1079-2.36 8.1079-4 12-5.389 7.4915-11.222 14.4915-17.5 21 7.198 12.561 14.532 25.061 22 37.5-.145.772-.478 1.439-1 2-9.333.667-18.667.667-28 0l-6-3c-10.5578-16.384-20.8911-32.884-31-49.5Z"/>
        <path fill="#ffffff" d="M71.5 81.5c-.904.709-1.2373 1.709-1 3-6.5003-1.3148-13.0003-1.3148-19.5 0-2.9442 16.274-5.6109 32.608-8 49-.5 1.167-1.3333 2-2.5 2.5-8.5921 2.14-17.0921 1.973-25.5-.5 1.6773-17.058 3.6773-34.058 6-51-6.0758-.9764-12.24243-1.3097-18.5-1-.15668-1.3734.00999-2.7068.5-4 10.3693-10.7008 20.3693-21.7008 30-33 2.754-3.2621 5.9206-5.9288 9.5-8 1.5293.0288 2.696.6955 3.5 2 8.3287 13.8168 16.8287 27.4835 25.5 41Z"/>
      </svg>
      <span class="text-[17px] font-bold text-gray-200">Dashboard</span>
    </div>

    <!-- Başlıq -->
    <h1 class="text-[22px] font-bold text-slate-100 mb-1.5">Xoş gəldiniz</h1>
    <p class="text-[13px] font-medium text-gray-600 mb-8">Hesabınıza daxil olun</p>

    <!-- E-poçt -->
    <div class="mb-5">
      <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-widest mb-2">E-poçt</label>
      <input
        type="email"
        placeholder="ornek@mail.com"
        class="w-full bg-[#081028] border border-white/[0.08] rounded-lg px-3.5 py-2.5 text-[14px] font-medium text-gray-200 placeholder-gray-700 outline-none focus:border-[#017bfe]/50 transition-colors"
      />
    </div>

    <!-- Şifrə -->
    <div class="mb-7">
      <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-widest mb-2">Şifrə</label>
      <input
        type="password"
        placeholder="••••••••"
        class="w-full bg-[#081028] border border-white/[0.08] rounded-lg px-3.5 py-2.5 text-[14px] font-medium text-gray-200 placeholder-gray-700 outline-none focus:border-[#017bfe]/50 transition-colors"
      />
    </div>

    <!-- Məni xatırla & Şifrəni unutdum -->
    <div class="flex items-center justify-between mb-7">
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" class="accent-[#017bfe] cursor-pointer" />
        <span class="text-[13px] font-medium text-gray-500">Məni xatırla</span>
      </label>
      <button class="text-[13px] font-semibold text-[#017bfe] hover:text-blue-400 transition-colors">
        Şifrəni unutdum?
      </button>
    </div>

    <!-- Daxil ol düyməsi -->
    <button class="w-full bg-[#017bfe] hover:bg-[#0267d4] active:scale-[0.99] transition-all text-white text-[14px] font-bold rounded-lg py-3 mb-6 tracking-wide">
      Daxil ol
    </button>

    <!-- Qeydiyyat -->
    <p class="text-center text-[13px] font-medium text-gray-600">
      Hesabınız yoxdur?
      <span class="text-[#017bfe] font-semibold cursor-pointer hover:text-blue-400 transition-colors">Qeydiyyat</span>
    </p>

  </div>

</body>
</html>
