<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daxil ol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet"/>
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="min-h-screen bg-[#081028] flex items-center justify-center">

  <div class="w-[380px] bg-[#0b1739] border border-white/[0.07] rounded-2xl px-9 py-10">

    <!-- Logo -->
    <div class="flex items-center gap-3 mb-8">
      <img src="https://html.laralink.com/bizmax/assets/img/logo.svg" alt="">
      
      
    </div>


    <!-- E-poçt -->
    <div class="mb-5">
      <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-widest mb-2">E-poçt</label>
      <input
        type="email"
        placeholder="ornek@mail.com"
        class="w-full bg-[#081028] border border-white/[0.08] rounded-lg px-3.5 py-2.5 text-[14px] font-medium text-gray-200 placeholder-gray-700 outline-none focus:border-[#017bfe]/50 transition-colors"
      />
    </div>

    <!-- Şifrə -->
    <div class="mb-7">
      <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-widest mb-2">Şifrə</label>
      <input
        type="password"
        placeholder="••••••••"
        class="w-full bg-[#081028] border border-white/[0.08] rounded-lg px-3.5 py-2.5 text-[14px] font-medium text-gray-200 placeholder-gray-700 outline-none focus:border-[#017bfe]/50 transition-colors"
      />
    </div>

    <!-- Məni xatırla & Şifrəni unutdum -->
    <div class="flex items-center justify-between mb-7">
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" class="accent-[#017bfe] cursor-pointer" />
        <span class="text-[13px] font-medium text-gray-500">Məni xatırla</span>
      </label>
      <button class="text-[13px] font-semibold text-[#017bfe] hover:text-blue-400 transition-colors">
        Şifrəni unutdum?
      </button>
    </div>

    <!-- Daxil ol düyməsi -->
    <button class="w-full bg-[#017bfe] hover:bg-[#0267d4] active:scale-[0.99] transition-all text-white text-[14px] font-bold rounded-lg py-3 mb-6 tracking-wide">
      Daxil ol
    </button>

    <!-- Qeydiyyat -->
    <p class="text-center text-[13px] font-medium text-gray-600">
      Hesabınız yoxdur?
      <span class="text-[#017bfe] font-semibold cursor-pointer hover:text-blue-400 transition-colors">Qeydiyyat</span>
    </p>

  </div>

</body>
</html>
